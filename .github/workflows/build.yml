name: Build and release

on:
  push:
    branches: [smart_core]
    tags: ['v[0-9]*']
    paths-ignore:
      - '**/*.md'
      - 'apps/ios/**'
      - 'modules/mihomo-ios-core/**'
      - '.github/workflows/ios.yml'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/workflows/issues.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-release-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  CLASH_PARTY_UPDATE_REPOSITORY: ${{ github.repository }}
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run review
      - run: pnpm test
      - name: Plan an immutable release
        run: node scripts/release-plan.mjs
      - uses: actions/upload-artifact@v6
        with:
          name: release-metadata
          path: release-metadata/
          retention-days: 3
          if-no-files-found: error
          overwrite: true

  packages:
    needs: checks
    name: ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win32
            arch: x64
            runner: windows-latest
            script: build:win
          - platform: win32
            arch: arm64
            runner: windows-11-arm
            script: build:win
          - platform: darwin
            arch: x64
            runner: macos-15-intel
            script: build:mac
          - platform: darwin
            arch: arm64
            runner: macos-latest
            script: build:mac
    env:
      npm_config_arch: ${{ matrix.arch }}
      npm_config_target_arch: ${{ matrix.arch }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          architecture: ${{ matrix.arch }}
      - uses: pnpm/action-setup@v4
      - uses: actions/download-artifact@v6
        with:
          name: release-metadata
          path: release-metadata
      - name: Apply the planned version
        run: node scripts/release-plan.mjs --apply
      - name: Confirm native runner and prepare resources
        run: |
          node scripts/verify-package.mjs --host ${{ matrix.platform }} ${{ matrix.arch }}
          pnpm install --frozen-lockfile
      - name: Run platform regression tests
        run: pnpm test
      - name: Build Windows packages
        if: matrix.platform == 'win32'
        run: pnpm run build:win --${{ matrix.arch }}
      - name: Mark the portable archive
        if: matrix.platform == 'win32'
        shell: pwsh
        run: |
          New-Item -Path PORTABLE -ItemType File
          Get-ChildItem dist/*portable.7z | ForEach-Object {
            7z a $_.FullName PORTABLE
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build macOS packages
        if: matrix.platform == 'darwin'
        run: |
          chmod +x build/pkg-scripts/preinstall build/pkg-scripts/postinstall
          pnpm run build:mac --${{ matrix.arch }} -c.mac.identity=-
      - name: Verify packaged architecture, privacy resources and native module loading
        run: node scripts/verify-package.mjs ${{ matrix.platform }} ${{ matrix.arch }}
      - name: Generate checksums
        run: pnpm run checksum .pkg setup.exe portable.7z
      - uses: actions/upload-artifact@v6
        with:
          name: package-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            dist/*.pkg
            dist/*setup.exe
            dist/*portable.7z
            dist/*.sha256
            dist/build-manifest-*.json
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
          overwrite: true

  publish:
    needs: [checks, packages]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v6
        with:
          name: release-metadata
          path: release-metadata
      - uses: actions/download-artifact@v6
        with:
          pattern: package-*
          path: release-assets
          merge-multiple: true
      - name: Publish only the complete validated release
        run: node scripts/publish-release.mjs
