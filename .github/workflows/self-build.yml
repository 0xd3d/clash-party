name: Self build (artifacts only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: self-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CLASH_PARTY_UPDATE_REPOSITORY: ${{ github.repository }}
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
          - arch: arm64
            runner: windows-11-arm
    env:
      npm_config_arch: ${{ matrix.arch }}
      npm_config_target_arch: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      # The repository prepare/postinstall hooks download resources for this OS and arch.
      - name: Install dependencies and prepare native resources
        run: pnpm install --frozen-lockfile
      - name: Build installer and portable archive
        run: pnpm run build:win --${{ matrix.arch }}
      - name: Mark the portable archive
        shell: pwsh
        run: |
          New-Item -Path PORTABLE -ItemType File
          Get-ChildItem dist/*portable.7z | ForEach-Object {
            7z a $_.FullName PORTABLE
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Generate checksums
        run: pnpm run checksum setup.exe portable.7z
      - uses: actions/upload-artifact@v6
        with:
          name: self-build-windows-${{ matrix.arch }}
          path: |
            dist/*setup.exe
            dist/*portable.7z
            dist/*.sha256
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 7

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-latest
    env:
      npm_config_arch: ${{ matrix.arch }}
      npm_config_target_arch: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
      - name: Install dependencies and prepare native resources
        run: pnpm install --frozen-lockfile
      - name: Build a self-use package with an ad-hoc app signature
        run: |
          chmod +x build/pkg-scripts/preinstall build/pkg-scripts/postinstall
          pnpm run build:mac --${{ matrix.arch }} -c.mac.identity=-
      - name: Generate checksums
        run: pnpm run checksum .pkg
      - uses: actions/upload-artifact@v6
        with:
          name: self-build-macos-${{ matrix.arch }}
          path: |
            dist/*.pkg
            dist/*.sha256
          if-no-files-found: error
          overwrite: true
          compression-level: 0
          retention-days: 7
