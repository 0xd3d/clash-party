appId: party.mihomo.app
productName: Clash Party
directories:
  buildResources: build
files:
  - '!apps{,/**}'
  - '!modules{,/**}'
  - '!**/.vscode/*'
  - '!src/*'
  - '!aur/*'
  - '!images/*'
  - '!scripts/*'
  - '!extra/*'
  - '!integrations/*'
  - '!tailwind.config.js'
  - '!postcss.config.js'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - 'node_modules/file-icon/file-icon'
extraResources:
  - from: './integrations/webrtc-guard/'
    to: 'integrations/webrtc-guard'
    filter:
      - '**/*'
      - '!**/*.d.ts'
      - '!**/*.d.mts'
  - from: './extra/'
    to: ''
protocols:
  name: 'Clash Party URI Scheme'
  schemes:
    - 'clash'
    - 'mihomo'
fileAssociations:
  - ext: 'cpx'
    name: 'Clash Party Plugin'
    description: 'Clash Party airport plugin descriptor'
    mimeType: 'application/x-clash-party-plugin'
    role: 'Viewer'
win:
  extraResources:
    - from: './build/native/windows/${arch}/party.mihomo.network-guard.exe'
      to: 'files/party.mihomo.network-guard.exe'
  target:
    - nsis
    - 7z
  artifactName: clash-party-windows-${version}-${arch}-portable.${ext}
nsis:
  artifactName: clash-party-windows-${version}-${arch}-setup.${ext}
  uninstallDisplayName: ${productName}
  allowToChangeInstallationDirectory: true
  oneClick: false
  perMachine: true
  createDesktopShortcut: always
mac:
  target:
    - pkg
  binaries:
    - 'Contents/Resources/files/party.mihomo.dns-guard'
    - 'Contents/Resources/sidecar/mihomo'
    - 'Contents/Resources/sidecar/mihomo-alpha'
    - 'Contents/Resources/sidecar/mihomo-smart'
  extraResources:
    - from: './build/native/party.mihomo.dns-guard'
      to: 'files/party.mihomo.dns-guard'
    - from: './integrations/macos-dns-guard/'
      to: 'integrations/macos-dns-guard'
    - from: './build/pkg-scripts/party.mihomo.helper.plist'
      to: 'files/party.mihomo.helper.plist'
  entitlementsInherit: build/entitlements.mac.plist
  hardenedRuntime: true
  gatekeeperAssess: false
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
  artifactName: clash-party-macos-${version}-${arch}.${ext}
pkg:
  allowAnywhere: false
  allowCurrentUserHome: false
  isRelocatable: false
  background:
    alignment: bottomleft
    file: build/background.png
linux:
  executableName: mihomo-party
  icon: build/icon.png
  desktop:
    entry:
      Name: Clash Party
      GenericName: Proxy Client
      Comment: A GUI client based on Mihomo
      MimeType: 'x-scheme-handler/clash;x-scheme-handler/mihomo'
      Keywords: proxy;clash;mihomo;vpn;
      StartupWMClass: mihomo-party
      Icon: mihomo-party
  target:
    - deb
    - rpm
    - pacman
  maintainer: mihomo-party-org
  category: Utility
  artifactName: clash-party-linux-${version}-${arch}.${ext}
deb:
  afterInstall: 'build/linux/postinst'
  afterRemove: 'build/linux/postuninst'
  fpm:
    - --depends
    - wl-clipboard
rpm:
  afterInstall: 'build/linux/postinst'
  afterRemove: 'build/linux/postuninst'
  fpm:
    - --depends
    - wl-clipboard
    - '--rpm-rpmbuild-define'
    - '_build_id_links none'
pacman:
  afterInstall: 'build/linux/postinst'
  afterRemove: 'build/linux/postuninst'
  fpm:
    - --pacman-compression
    - zstd
  depends:
    - alsa-lib
    - gtk3
    - libnotify
    - nss
    - libxss
    - libxtst
    - xdg-utils
    - at-spi2-core
    - util-linux-libs
    - libsecret
    - wl-clipboard
  artifactName: clash-party-linux-${version}-${arch}.pkg.tar.zst
npmRebuild: true
publish: []
